[project]
name = "ml-workshope-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "monish", email = "monish151mansuri@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
